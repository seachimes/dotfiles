# Global tool versions. These exact pins ARE the lock for global tools — mise
# does not generate a mise.lock for the global config, so a fresh machine
# installs exactly these versions via `mise install`. Reproducible + stable.
# Downloads are still integrity-checked by the backends (aqua = checksums,
# github = provenance). Per-project mise.toml overrides these.
#
# Update deliberately:  mise up   (bumps versions) then re-commit this file:
#   chezmoi re-add ~/.config/mise/config.toml && \
#     (cd "$(chezmoi source-path)" && git commit -am "tools: bump")

[tools]
atuin = "18.24.4"
bat = "0.26.1"
bun = "1.4.4"
eza = "0.23.5"
fd = "10.5.0"
fzf = "0.74.5"
gitleaks = "8.30.1"
jq = "1.8.2"
lazygit = "0.66.2"
neovim = "0.12.6"
node = "26.13.0"
ripgrep = "15.2.0"
starship = "1.27.0"
tree-sitter = "0.27.1"   # nvim-treesitter (main branch) builds parsers with this
uv = "0.13.6"
zoxide = "0.10.0"
# github backend (aqua's attestation check rejects releases that lack GitHub
# attestations, e.g. cli/cli, so install these straight from GitHub releases)
"github:cli/cli" = "2.103.3"        # gh — GitHub CLI
"github:pnpm/pnpm" = "12.16.1"      # pnpm — v11+ ships tar.gz assets the aqua registry doesn't map yet
# AI tooling — rtk (token-reducing CLI proxy)
"github:rtk-ai/rtk" = "1.1.0"
"github:herdrdev/herdr" = "0.9.5"      # herdr — agent-aware terminal multiplexer (tmux replacement)
zig = "0.16.0"
"github:yusukebe/ax" = "0.1.25"      # ax — the AI-era curl (yusukebe)
"github:microsoft/apm" = "0.35.0"   # apm — Agent Package Manager, deps for skills/agents/MCP across Claude/Codex/etc.
ghq = "1.11.2"                      # ghq — clone/manage repos in a tidy ~/ghq/<host>/<owner>/<repo> tree (Ctrl-G in zsh)
"npm:hunkdiff" = "0.24.1"           # hunk — terminal diff viewer for agent changesets (herdr prefix+d)
"npm:wrangler" = "4.156.2"          # wrangler — Cloudflare Workers CLI; global is for init/login/tail, projects pin their own
